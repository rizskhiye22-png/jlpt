<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1f2d">
  <meta name="description" content="Game RPG 3D untuk belajar hiragana, katakana, dan percakapan bahasa Jepang sehari-hari.">
  <title>Nihongo Gakkou</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" crossorigin src="./assets/index-CtoTSRSP.js"></script>
</head>
<body>
  <div id="app"></div>
  <!-- layar memuat: hilang saat game siap; menampilkan pesan bila ada yang gagal -->
  <div id="boot" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2a1f2d;color:#fbf7ef;font:16px/1.5 sans-serif;text-align:center;padding:24px">
    <div style="font-size:30px;letter-spacing:2px">にほんご がっこう</div>
    <div id="boot-msg">Memuat game…</div>
  </div>

  <!-- materi -->
  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/data3.js"></script>
  <script src="js/strokes.js"></script>
  <!-- grafis & suara -->
  <script src="js/portrait.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <!-- tampilan & permainan -->
  <script src="js/ui.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/games.js"></script>
  <script src="js/video.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/relax.js"></script>
  <script src="js/online.js"></script>
  <script src="js/places.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Dibuka tanpa build (mis. GitHub Pages "deploy from branch" dari akar repo)?
    // Arahkan ke versi siap pakai di folder docs/.
    if (typeof Game === 'undefined') {
      if (!/\/docs\/?/.test(location.pathname)) location.replace('docs/');
      else document.getElementById('boot-msg').textContent = 'Gagal memuat file game. Coba muat ulang halaman.';
    }
    setTimeout(function () {
      var b = document.getElementById('boot');
      if (b) document.getElementById('boot-msg').innerHTML = 'Masih memuat… Jika tidak berubah, muat ulang halaman atau hapus data situs (cache) di pengaturan browser.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;font-size:16px">Muat ulang</button>';
    }, 12000);
  </script>
  <!-- Mesin 3D + karakter realistis (React + TypeScript + Three.js).
       Dimuat terakhir; kalau gagal, game otomatis memakai mode 2D. -->
</body>
</html>
