<body>
  <div id="app"></div>
  <!-- layar memuat: hilang saat game siap; menampilkan pesan bila ada yang gagal -->
  <div id="boot" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2a1f2d;color:#fbf7ef;font:16px/1.5 sans-serif;text-align:center;padding:24px">
    <div style="font-size:30px;letter-spacing:2px">にほんご がっこう</div>
    <div id="boot-msg">Memuat game…</div>
    <div id="boot-err" style="font-size:13px;color:#f6b2a4;max-width:420px;word-break:break-word"></div>
  </div>
  <script>
    // Layar memuat: tampilkan error bila ada, dan tombol bantuan bila terlalu lama.
    (function () {
      var t0 = Date.now();
      function el(id) { return document.getElementById(id); }
      window.addEventListener('error', function (e) {
        var box = el('boot-err'); if (!box || !el('boot')) return;
        var src = e && e.target && (e.target.src || e.target.href);
        // Halaman sumber dibuka tanpa build (mis. Cloudflare/GitHub Pages dengan folder akar):
        // pindah otomatis ke versi siap pakai di docs/.
        if (src && /\/src\/main\.tsx$/.test(src) && !/\/docs\/?/.test(location.pathname)) { location.replace('docs/'); return; }
        box.innerHTML += '⚠ ' + (src ? 'Gagal memuat: ' + src.split('/').slice(-2).join('/') : (e.message || 'Error')) + '<br>';
      }, true);
      window.__resetGame = function () {
        var done = function () { location.reload(); };
        try {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(done, done);
        } catch (err) { done(); }
      };
      var timer = setInterval(function () {
        if (!el('boot') || window.__bootFail) { clearInterval(timer); return; }
        var s = Math.round((Date.now() - t0) / 1000);
        if (s < 10) { el('boot-msg').textContent = 'Memuat game… ' + s + ' detik'; return; }
        clearInterval(timer);
        el('boot-msg').innerHTML = 'Masih memuat… Koneksi mungkin lambat, atau HP menyimpan versi lama.' +
          '<br><button onclick="location.reload()" style="margin:12px 6px 0;padding:10px 16px;font-size:15px">Muat ulang</button>' +
          '<button onclick="__resetGame()" style="margin:12px 6px 0;padding:10px 16px;font-size:15px">Hapus cache &amp; muat ulang</button>';
      }, 1000);
    })();
  </script>

  <script>
    // Dibuka tanpa build (mis. GitHub Pages "deploy from branch" dari akar repo)?
    // Arahkan ke versi siap pakai di folder docs/.
    if (typeof Game === 'undefined') {
      if (!/\/docs\/?/.test(location.pathname)) location.replace('docs/');
      else {
        window.__bootFail = true;
        document.getElementById('boot-msg').innerHTML = 'Gagal memuat file game.<br><button onclick="__resetGame()" style="margin-top:12px;padding:10px 16px;font-size:15px">Hapus cache &amp; muat ulang</button>';
      }
    }
  </script>
